name: AI-Powered Claude Code Review & Analysis

on:
  # Pull request events for comprehensive code review
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]

  # Comment-based triggers for interactive AI assistance
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

  # Issue and PR review triggers for broader @claude coverage
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

  # Scheduled comprehensive audits
  schedule:
    - cron: "0 9 * * 1" # Weekly comprehensive review on Mondays at 9 AM

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  ai-review:
    # Trigger for PR events and @claude mentions in various contexts
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Determine Trigger Context
        run: |
          echo "🤖 AI-Powered Claude Analysis"
          echo "============================="
          echo "📍 Triggered by: ${{ github.event_name }}"
          echo ""

          case "${{ github.event_name }}" in
            pull_request)
              echo "🔍 Processing pull request for comprehensive review"
              echo "ANALYSIS_TYPE=comprehensive" >> $GITHUB_ENV
              ;;
            issue_comment)
              echo "💬 Processing issue comment with @claude mention"
              echo "ANALYSIS_TYPE=interactive" >> $GITHUB_ENV
              ;;
            pull_request_review_comment)
              echo "📝 Processing PR review comment with @claude mention"
              echo "ANALYSIS_TYPE=interactive" >> $GITHUB_ENV
              ;;
            pull_request_review)
              echo "🔍 Processing PR review with @claude mention"
              echo "ANALYSIS_TYPE=interactive" >> $GITHUB_ENV
              ;;
            issues)
              echo "📋 Processing issue with @claude mention"
              echo "ANALYSIS_TYPE=interactive" >> $GITHUB_ENV
              ;;
          esac

      - name: Run Comprehensive Validation
        if: env.ANALYSIS_TYPE == 'comprehensive'
        run: |
          echo "🔍 Running comprehensive validation suite..."
          echo ""
          echo "🔒 Security Validation:"
          npm run lint:security || echo "⚠️ Security warnings detected"
          echo ""
          echo "🏗️ Architecture Validation:"
          npm run lint:architecture || echo "❌ Architecture issues detected"
          echo ""
          echo "⚡ Performance Validation:"
          npm run lint:performance || echo "⚠️ Performance warnings detected"
          echo ""

      - name: Run Basic Validation
        if: env.ANALYSIS_TYPE == 'interactive'
        run: |
          echo "🔍 Running basic validation suite..."
          npm run validate:all || echo "⚠️ Some validations found issues"

      - name: Custom Command Detection
        if: >
          github.event_name == 'issue_comment' ||
          github.event_name == 'pull_request_review_comment' ||
          github.event_name == 'pull_request_review'
        env:
          COMMENT_BODY: ${{ github.event.comment.body || github.event.review.body }}
        run: |
          # Safely process comment body using environment variable
          # This prevents code injection by avoiding direct shell interpolation

          if echo "$COMMENT_BODY" | grep -q "/architecture-review"; then
            echo "CUSTOM_COMMAND=architecture-review" >> $GITHUB_ENV
          elif echo "$COMMENT_BODY" | grep -q "/security-scan"; then
            echo "CUSTOM_COMMAND=security-scan" >> $GITHUB_ENV
          elif echo "$COMMENT_BODY" | grep -q "/performance-check"; then
            echo "CUSTOM_COMMAND=performance-check" >> $GITHUB_ENV
          elif echo "$COMMENT_BODY" | grep -q "/documentation-audit"; then
            echo "CUSTOM_COMMAND=documentation-audit" >> $GITHUB_ENV
          elif echo "$COMMENT_BODY" | grep -q "/quick-fix"; then
            echo "CUSTOM_COMMAND=quick-fix" >> $GITHUB_ENV
          fi

      - name: Execute Custom Command
        if: env.CUSTOM_COMMAND != ''
        run: |
          echo "🎯 Executing custom command: $CUSTOM_COMMAND"
          echo "============================================"
          if [ -f ".claude/commands/${CUSTOM_COMMAND}.md" ]; then
            cat .claude/commands/${CUSTOM_COMMAND}.md
          else
            echo "⚠️ Custom command file not found: .claude/commands/${CUSTOM_COMMAND}.md"
          fi

      - name: AI Analysis Summary
        run: |
          echo ""
          echo "📊 AI-Powered Analysis Summary"
          echo "=============================="
          echo ""

          if [ "$ANALYSIS_TYPE" = "comprehensive" ]; then
            echo "🔍 Comprehensive code review completed for PR"
            echo "📋 Analysis includes:"
            echo "  - Architecture compliance review"
            echo "  - Security vulnerability assessment"
            echo "  - Performance optimization analysis"
            echo "  - Code maintainability evaluation"
          else
            echo "💬 Interactive AI assistance provided"
            echo "🎯 Trigger: ${{ github.event_name }}"
            if [ -n "$CUSTOM_COMMAND" ]; then
              echo "🔧 Custom command executed: $CUSTOM_COMMAND"
            fi
          fi

          echo ""
          echo "🔧 Available AI-powered commands:"
          echo "  - /architecture-review - Comprehensive architecture analysis"
          echo "  - /security-scan - Security vulnerability assessment"
          echo "  - /performance-check - Performance optimization review"
          echo "  - /documentation-audit - Documentation quality review"
          echo "  - /quick-fix - Immediate actionable fixes"
          echo ""
          echo "💡 Mention @claude in comments for AI assistance"

  comprehensive-audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Weekly Comprehensive Audit
        run: |
          echo "📅 Weekly Architecture and Security Audit - $(date '+%Y-%m-%d')"
          echo "=============================================="
          echo ""
          echo "🏗️ Architecture Evolution Assessment:"
          npm run lint:architecture || echo "⚠️ Architecture issues detected"
          echo ""
          echo "🔒 Security Posture Review:"
          npm run lint:security || echo "⚠️ Security issues detected"
          echo ""
          echo "⚡ Performance Trends Analysis:"
          npm run lint:performance || echo "⚠️ Performance issues detected"
          echo ""
          echo "📖 Documentation Currency Check:"
          npm run docs:validate-structure || \
            echo "⚠️ Documentation issues detected"
          echo ""
          echo "🔍 Full Validation Suite:"
          npm run validate:all || echo "⚠️ Some validations found issues"
          echo ""
          echo "✅ Comprehensive weekly audit completed"
          echo "💡 For detailed analysis, run individual validation commands"
          echo "   or use AI agent custom commands with @claude mentions"
